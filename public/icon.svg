  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- صليب -->
  <g fill="url(#gold)">
    <rect x="236" y="96" width="40" height="320" rx="8"/>
    <rect x="136" y="196" width="240" height="40" rx="8"/>
  </g>

  <!-- هالة حول الصليب -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.35"/>

  <!-- حرف M -->
  <text x="256" y="470" text-anchor="middle" font-family="Amiri, serif" font-size="64" font-weight="700" fill="#e6c65a">M</text>
