      <stop offset="0%" stop-color="#1e2a4a"/>
      <stop offset="100%" stop-color="#2c3b63"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6c65a"/>
      <stop offset="100%" stop-color="#c9a227"/>
